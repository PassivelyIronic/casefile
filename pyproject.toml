[project]
name = "casefile"
version = "0.1.0"
description = "Multi-agent complaint review system for consumer financial products, built on CFPB complaint data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pyyaml>=6.0,<7",
    "httpx>=0.28,<1",
    "langchain-core~=1.8.0",
    "langgraph~=1.2.20",
    "langgraph-checkpoint-postgres~=3.2.0",
    "langchain-google-genai~=4.5.0",
    "langchain-ollama~=1.1.0",
    "psycopg[binary,pool]>=3.3,<4",
    "pgvector>=0.5,<1",
]

[dependency-groups]
data = [
    "huggingface-hub>=2.4,<3",
    "pandas>=3.1,<4",
    "pyarrow>=26.0",
    "scikit-learn>=1.9,<2",
]
mcp = [
    "mcp~=1.30.0",
    "langchain-mcp-adapters~=0.3.2",
]
api = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
]
ui = [
    "streamlit>=1.67,<2",
]
dev = [
    "ruff>=0.17.4",
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pre-commit>=4.7",
    "types-pyyaml",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casefile"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not llm'"
markers = [
    "integration: needs Docker Compose services / local Ollama (run with `make test-int`)",
    "llm: calls a real LLM provider, never in the default suite",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
